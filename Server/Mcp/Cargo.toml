[package]
name = "capture-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "captureMcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
percent-encoding = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
rmcp = { version = "3.1.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
