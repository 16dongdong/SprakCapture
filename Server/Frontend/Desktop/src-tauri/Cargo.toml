[package]
name = "desktop-shell"
version = "0.1.0"
description = "加载 Web 前端并管理本地代理服务生命周期的桌面外壳"
edition = "2024"
rust-version = "1.85"

[lib]
name = "desktop_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "desktop-shell"
path = "src/main.rs"
# 桌面入口清单要求管理员权限，测试进程无法在非交互构建上下文中弹出提权界面；
# 业务逻辑由同包库目标覆盖，关闭二进制测试目标可避免把平台启动约束误判为测试失败。
test = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
