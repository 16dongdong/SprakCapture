[package]
name = "capture-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "capture"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
