[package]
name = "http-proxy-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
capture-core = { path = "../Capture" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "native-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server", "server-auto", "tokio"] }
location-core = { path = "../Location" }
mime_guess = "2"
parking_lot = "0.12"
p12-keystore = "0.3.1"
plugin-host = { path = "../PluginHost" }
socks5-core = { path = "../Socks5" }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
transport-core = { path = "../Transport" }
tower-service = "0.3"
x509-parser = "0.18"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"
tempfile = "3"
