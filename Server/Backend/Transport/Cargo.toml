[package]
name = "transport-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }
