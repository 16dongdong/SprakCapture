[package]
name = "proxy-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "proxyService"
path = "src/main.rs"

[dependencies]
aes = "0.9"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
brotli = "8"
bytes = "1"
directories = "6"
futures-util = "0.3"
flate2 = "1"
http = "1"
hex = "0.4"
parking_lot = "0.12"
png = "0.17"
plugin-host = { path = "PluginHost" }
process-capture-core = { path = "ProcessCapture" }
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
capture-core = { path = "Capture" }
capture-mcp = { path = "../Mcp" }
http-proxy-core = { path = "HttpProxy" }
location-core = { path = "Location" }
socks5-core = { path = "Socks5" }
transport-core = { path = "Transport" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
prost-types = "0.13"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
