[package]
name = "socks5-core"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot = "0.12"
plugin-host = { path = "../PluginHost" }
transport-core = { path = "../Transport" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
